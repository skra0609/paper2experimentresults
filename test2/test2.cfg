SPECIFICATION Spec

\* PUF-based Security Model Configuration
\* This configuration tests the enhanced PUF-based enrollment and verification system
\* with comprehensive security protections against various attack vectors

CONSTANTS
  \* Stage atoms (model values)
  Design = Design
  Verification = Verification  
  Fabrication = Fabrication
  Testing = Testing
  Integration = Integration
  Final = Final
  
  \* Manager atoms (model values)
  DesignManager = DesignManager
  VerificationManager = VerificationManager
  FabricationManager = FabricationManager
  TestingManager = TestingManager
  IntegrationManager = IntegrationManager
  Owner = Owner
  Attacker = Attacker
  
  \* Parameterized sets/functions
  LegitimateIssuers = {DesignManager, VerificationManager, FabricationManager, TestingManager, IntegrationManager, Owner}
  AttackerIssuers = {Attacker}
  
  \* Chiplet and system parameters
  Chip = {c1}
  ChipletId = 1
  ChipletOwner = Owner
  MaxMCId = 2
  MaxPUFId = 1
  MaxSiPId = 1
  ChipletSet = {c1,c2}
  MaxChipletsPerSiP = 1
  MaxVCId = 1
  MaxSessionId = 1
  MaxNonce = 1
  MaxAttestationLag = 1
  AttestationTTL = 1 \* for HasSupplyChainTamperingIndicators
  AllowCounterfeitIntegrate = FALSE

SYMMETRY Symmetry

\* PROPERTIES
PROPERTIES
  IntegrationRequiresFreshAttestation
  IntegrationWithinAttestationTTL
  Safety
  Security
  NoIntegrationWhenTamperIndicators
  NoIntegrateRevoked
  NoVerifyRevoked

VIEW ViewSecurity

ACTION_CONSTRAINT NoStutter

CHECK_DEADLOCK FALSE 


